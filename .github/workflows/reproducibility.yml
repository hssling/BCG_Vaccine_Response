name: Reproducibility Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-analysis:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib seaborn python-docx

    - name: Verify Data Integrity (Check CSV exists)
      run: |
        if [ -f "1_data/source_data_extraction.csv" ]; then
          echo "✅ Source Data Found"
        else
          echo "❌ Source Data Missing!"
          exit 1
        fi

    - name: Run Analysis Script
      run: |
        python 2_analysis/02_systematic_review_analysis.py

    - name: Verify Outputs Generated
      run: |
        if [ -f "3_results/figures/Fig1_Heterogeneity_Distribution.png" ]; then
          echo "✅ Figure 1 Generated Successfully"
        else
          echo "❌ Figure 1 Generation Failed"
          exit 1
        fi
